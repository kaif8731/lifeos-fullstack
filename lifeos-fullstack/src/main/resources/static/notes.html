<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS | Notes</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="pages.css">
</head>
<body data-page="notes">

<div class="app">

    <aside class="sidebar" id="sidebar">
        <a href="index.html" class="logo" aria-label="LifeOS Home">
            <span class="logo-icon">L</span>
            <span>Life<span class="logo-blue">OS</span></span>
        </a>

        <!-- links are built by script.js (NAV array) -->
        <nav class="sidebar-nav" id="sidebarNav"></nav>

        <div class="sidebar-bottom">
            <div class="profile-avatar" id="profileAvatar">U</div>
            <div class="profile-info">
                <h4 id="profileName">My Workspace</h4>
                <p>Personal Workspace</p>
            </div>
            <a href="login.html" class="logout" id="logoutLink" title="Log out">↗</a>
        </div>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
                <div>
                    <p class="breadcrumb">Workspace / Notes</p>
                    <h2>Notes</h2>
                </div>
            </div>
            <div class="topbar-right">
                <span id="todayDate" class="today-date"></span>
            </div>
        </header>

        <section class="page-head">
            <p class="welcome-label">NOTES</p>
            <h1>Notes</h1>
            <p class="welcome-text">Save ideas, study notes and reminders, and connect them to projects.</p>
        </section>

        <section class="mini-stats" id="stats"></section>

        <section class="module-grid">

            <article class="panel form-panel">
                <div class="panel-header">
                    <div>
                        <h3 id="formTitle">Add</h3>
                        <p>Write something down.</p>
                    </div>
                </div>
                <form id="itemForm" class="module-form" autocomplete="off">
                    <label class="field"><span>Title</span><input type="text" name="title" placeholder="Note title" maxlength="120" required></label>
                    <label class="field"><span>Note</span><textarea name="content" rows="5" maxlength="2000" placeholder="Write your note..." required></textarea></label>
                    <label class="field"><span>Tag</span><input type="text" name="tag" placeholder="e.g. study (optional)" maxlength="120" ></label>
                    <label class="field"><span>Project</span><select name="projectId" data-project-select><option value="">No project</option></select></label>
                    <div class="form-actions">
                        <button type="submit" class="add-btn" id="submitBtn">Add</button>
                        <button type="button" class="ghost-btn hidden" id="cancelEdit">Cancel</button>
                    </div>
                </form>
            </article>

            <article class="panel">
                <div class="panel-header">
                    <div>
                        <h3 id="listTitle">Your notes</h3>
                        <p>Newest first.</p>
                    </div>
                    <span class="panel-badge" id="countBadge">0</span>
                </div>
                <div class="toolbar">
                    <input id="filterInput" type="search" placeholder="Search notes..." aria-label="Filter list">
                </div>
                <div id="itemList" class="item-list"></div>
            </article>

        </section>

        <footer class="dashboard-footer">
            <p>© 2026 LifeOS. Your life, organized in one place.</p>
            <a href="dashboard.html">Back to dashboard</a>
        </footer>

    </main>
</div>

<script src="script.js"></script>
</body>
</html>
